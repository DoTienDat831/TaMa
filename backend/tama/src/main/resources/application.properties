spring.application.name=tama
server.port=${PORT:8080}

# PostgreSQL connection. Override these values with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tama_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Development schema management: create missing tables and update changed mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
