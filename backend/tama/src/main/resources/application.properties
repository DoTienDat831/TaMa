spring.application.name=tama

# MySQL connection. Override these values with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tama_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:30092006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development schema management: create missing tables and update changed mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
